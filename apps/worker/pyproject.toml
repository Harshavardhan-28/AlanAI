[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpaudit-worker"
version = "0.1.0"
description = "MCP Audit worker: ingestion, orchestrator, audit agents, scoring, scheduler, docs"
requires-python = ">=3.12"
dependencies = [
  "mcpaudit-shared",
  "arq>=0.26",
  "redis>=5.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "boto3>=1.35",
  "httpx>=0.28",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "docker>=7.1",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "aioresponses>=0.7"]

[tool.setuptools.packages.find]
include = ["worker*"]
