name: mcpaudit

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mcpaudit
      POSTGRES_PASSWORD: mcpaudit
      POSTGRES_DB: mcpaudit
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpaudit"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mcpaudit
      MINIO_ROOT_PASSWORD: mcpaudit-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 mcpaudit mcpaudit-dev-only;
      mc mb -p local/mcpaudit-snapshots local/mcpaudit-evidence local/mcpaudit-docs || true;
      exit 0;"

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    env_file: ../.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://mcpaudit:mcpaudit@db:5432/mcpaudit
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    env_file: ../.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://mcpaudit:mcpaudit@db:5432/mcpaudit
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      api:
        condition: service_healthy
    # Worker needs docker access to spawn sandbox containers (DinD socket mount, dev only)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db-data:
  minio-data:
