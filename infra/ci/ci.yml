name: ci

# NOTE (D-12): this file lives in infra/ci/ because the automation token pushing to GitHub
# lacks the `workflows` permission. A human with workflow permission must copy it to
# .github/workflows/ci.yml to activate CI. `make test` covers the same checks locally.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e packages/shared/python -e "apps/api[dev]" -e "apps/worker[dev]" pytest ruff mypy
      - name: Ruff
        run: ruff check apps packages/shared/python
      - name: Ruff format check
        run: ruff format --check apps packages/shared/python
      - name: Mypy
        run: mypy apps/api/app apps/worker/worker packages/shared/python/mcpaudit_shared
      - name: Pytest
        run: pytest apps/api/tests apps/worker/tests packages/shared/python/tests -q

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate OpenAPI spec
        run: pip install openapi-spec-validator && python -c "from openapi_spec_validator import validate_spec; import yaml; validate_spec(yaml.safe_load(open('packages/shared/openapi.yaml')))"

  e2e:
    runs-on: ubuntu-latest
    needs: [python, typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Bring up stack
        run: make dev
      - name: Run e2e
        run: make test-e2e
